server:
  forward-headers-strategy: none
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: gateflow
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      timeout: ${REDIS_COMMAND_TIMEOUT:250ms}
      ssl:
        enabled: ${REDIS_SSL:false}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    connection-timeout: 2s
    requested-heartbeat: 10s
    channel-rpc-timeout: 3000
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    ssl:
      enabled: ${RABBITMQ_SSL:false}
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.connectiontimeout: 1000
      mail.smtp.timeout: 2000
      mail.smtp.writetimeout: 2000
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    clean-disabled: true
    baseline-on-migrate: false
    out-of-order: false
    validate-migration-naming: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
      fail-on-trailing-tokens: true
gateflow:
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    consumer-enabled: ${NOTIFICATION_CONSUMER_ENABLED:true}
    email-enabled: ${EMAIL_ENABLED:false}
    email-worker-enabled: ${EMAIL_WORKER_ENABLED:true}
    max-attempts: 5
    batch-size: 5
    poll-interval-ms: 1000
    lease-duration: PT1M
    retry-base: PT10S
    retry-max: PT5M
    max-age: PT48H
    from: ${EMAIL_FROM:no-reply@gateflow.invalid}
  async:
    enabled: ${ASYNC_ENABLED:false}
    relay-enabled: ${ASYNC_RELAY_ENABLED:true}
    consumer-enabled: ${ASYNC_CONSUMER_ENABLED:true}
    batch-size: ${ASYNC_BATCH_SIZE:20}
    poll-interval-ms: ${ASYNC_POLL_INTERVAL_MS:1000}
    confirm-timeout: ${ASYNC_CONFIRM_TIMEOUT:PT2S}
    lease-duration: ${ASYNC_LEASE_DURATION:PT30S}
    retry-base: ${ASYNC_RETRY_BASE:PT1S}
    retry-max: ${ASYNC_RETRY_MAX:PT1M}
    retry-delays: [5s, 30s, 120s]
  cache:
    workflow:
      enabled: ${PUBLISHED_POLICY_CACHE_ENABLED:false}
      ttl: ${PUBLISHED_POLICY_CACHE_TTL:PT10M}
      failure-cooldown: ${PUBLISHED_POLICY_CACHE_COOLDOWN:PT5S}
      max-bytes: ${PUBLISHED_POLICY_CACHE_MAX_BYTES:65536}
  rbac:
    max-organizations-per-user: ${RBAC_ORG_LIMIT:10}
    max-roles-per-organization: ${RBAC_ROLE_LIMIT:100}
  auth:
    session-ttl: ${AUTH_SESSION_TTL:PT12H}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    login-limit: ${AUTH_LOGIN_LIMIT:10}
    signup-limit: ${AUTH_SIGNUP_LIMIT:5}
    rate-window: ${AUTH_RATE_WINDOW:PT1M}

logging:
  level:
    # Raw JDBC errors may include identifying values from unique-key violations.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

# Internal developer documentation; never silently expose in production.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    version: OPENAPI_3_0
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    disable-swagger-default-url: true
    validator-url: ""
    persist-authorization: false
    with-credentials: true
    csrf:
      enabled: true
      header-name: X-XSRF-TOKEN
  paths-to-match: /api/v1/**
  override-with-generic-response: false
