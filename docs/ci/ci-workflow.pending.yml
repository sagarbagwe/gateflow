name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          {
            name: backend-jar,
            path: backend/target/gateflow-backend-*.jar,
            if-no-files-found: error,
          }
  full-stack:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: gateflow-ci
      GATEFLOW_DISPOSABLE_STACK: "1"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable CI-only credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, secrets
          replacements={
            'replace-with-a-unique-local-password':secrets.token_hex(24),
            'replace-with-a-unique-redis-password':secrets.token_hex(24),
            'replace-with-a-unique-rabbitmq-password':secrets.token_hex(24),
          }
          text=pathlib.Path('.env.example').read_text()
          for old,new in replacements.items(): text=text.replace(old,new)
          pathlib.Path('.env').write_text(text)
          pathlib.Path('.env').chmod(0o600)
          PY
      - run: docker compose config --quiet
      - run: bash scripts/test-stack.sh
      - name: Verify authenticated approval lifecycle on disposable stack
        run: python3 scripts/verify-browser-flow.py
      - name: Run repeatable transport smoke workload
        run: |
          mkdir -p verification
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e BASE_URL \
            grafana/k6:1.3.0 run --summary-export=/work/verification/k6-summary.json /work/scripts/performance-smoke.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          {
            name: transport-smoke-evidence,
            path: verification/k6-summary.json,
            if-no-files-found: ignore,
          }
      - name: Tear down only this disposable stack
        if: always()
        run: |
          trap 'rm -f .env' EXIT
          docker compose down --volumes --remove-orphans
