name: Verify milestones 14-20
on:
  push:
    branches: [verify-milestones-14-20]
    paths-ignore: [milestones-14-20-results.md]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - name: Configure isolated stack
        run: |
          cp .env.example .env
          sed -i "s/replace-with-a-unique-local-password/ci-db-${GITHUB_RUN_ID}/; s/replace-with-a-unique-redis-password/ci-redis-${GITHUB_RUN_ID}/; s/replace-with-a-unique-rabbitmq-password/ci-rabbit-${GITHUB_RUN_ID}/" .env
      - name: Frontend lint build and tests
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit && npm run lint && npm test && npm run build
      - name: Production dependency audit
        id: audit
        continue-on-error: true
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee ../audit.log
      - name: Compose configuration
        id: compose
        continue-on-error: true
        run: docker compose config --quiet
      - name: Production image builds
        id: images
        continue-on-error: true
        run: docker compose build backend frontend
      - name: Full stack smoke test
        id: stack
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/test-stack.sh 2>&1 | tee stack.log
      - name: Observability contract
        id: observability
        continue-on-error: true
        run: |
          curl -fsS http://127.0.0.1:8080/actuator/health/liveness | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:8080/actuator/health/readiness | grep -q '"status":"UP"'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/actuator/prometheus)" = 401
      - name: Performance smoke
        id: performance
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm --network host -v "$PWD/scripts:/scripts:ro" grafana/k6:0.57.0 run /scripts/performance-smoke.js 2>&1 | tee performance.log
      - name: Architecture security and CI evidence
        id: documents
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required={
            'docs/observability/runbook.md':['alert','readiness','outbox'],
            'docs/aws/architecture.md':['Aurora','Fargate','recovery','rollback'],
            'docs/performance/baseline.md':['p95','acceptance','workload'],
            'docs/security/review.md':['Threat model','Finding','release checklist'],
            '.github/workflows/ci.yml':['frontend','backend','containers'],
            '.github/workflows/codeql.yml':['CodeQL','analyze'],
            '.github/dependabot.yml':['maven','npm','docker']}
          for path,terms in required.items():
              text=Path(path).read_text()
              for term in terms: assert term.lower() in text.lower(), f'{path}: missing {term}'
          print('PASS: M15/M17/M18/M19/M20 evidence files')
          PY
      - name: Record all outcomes
        if: always()
        env:
          FRONTEND: ${{ steps.frontend.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          STACK: ${{ steps.stack.outcome }}
          OBSERVABILITY: ${{ steps.observability.outcome }}
          PERFORMANCE: ${{ steps.performance.outcome }}
          DOCUMENTS: ${{ steps.documents.outcome }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime, os
          names=['FRONTEND','AUDIT','COMPOSE','IMAGES','STACK','OBSERVABILITY','PERFORMANCE','DOCUMENTS']
          labels={'FRONTEND':'M14 frontend lint/build/tests','AUDIT':'M20 production dependency audit','COMPOSE':'M16 Compose validation','IMAGES':'M16 production image builds','STACK':'M16 full-stack runtime smoke','OBSERVABILITY':'M15 health/metrics access contract','PERFORMANCE':'M19 k6 performance smoke','DOCUMENTS':'M17/M18/M20 CI, AWS, and security evidence'}
          rows='\n'.join(f"| {labels[n]} | **{os.environ[n].upper()}** |" for n in names)
          diagnostics=[]
          for name,path in [('dependency audit','audit.log'),('full-stack smoke','stack.log'),('performance smoke','performance.log')]:
              p=Path(path)
              if p.exists():
                  lines=p.read_text(errors='replace').splitlines()[-60:]
                  diagnostics.append(f'## {name} output (last 60 lines)\n\n```text\n'+ '\n'.join(lines) +'\n```')
          Path('milestones-14-20-results.md').write_text(f'''# Milestones 14-20 verification\n\n- Source commit: `{os.environ['GITHUB_SHA']}`\n- Completed: {datetime.datetime.now(datetime.timezone.utc).isoformat()}\n- Runner: GitHub-hosted Ubuntu with Java 21, Node 22, Docker and k6\n\n| Gate | Outcome |\n|---|---|\n{rows}\n\nAll gates must be SUCCESS before Milestones 14-20 are considered verified.\n\n'''+'\n\n'.join(diagnostics)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add milestones-14-20-results.md
          git commit -m 'test: record milestones 14-20 verification [skip ci]'
          git push
      - name: Enforce every milestone gate
        if: always()
        env:
          ALL: ${{ join(steps.*.outcome, ',') }}
          FRONTEND: ${{ steps.frontend.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          COMPOSE: ${{ steps.compose.outcome }}
          IMAGES: ${{ steps.images.outcome }}
          STACK: ${{ steps.stack.outcome }}
          OBSERVABILITY: ${{ steps.observability.outcome }}
          PERFORMANCE: ${{ steps.performance.outcome }}
          DOCUMENTS: ${{ steps.documents.outcome }}
        run: |
          test "$FRONTEND" = success
          test "$AUDIT" = success
          test "$COMPOSE" = success
          test "$IMAGES" = success
          test "$STACK" = success
          test "$OBSERVABILITY" = success
          test "$PERFORMANCE" = success
          test "$DOCUMENTS" = success
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans || true
