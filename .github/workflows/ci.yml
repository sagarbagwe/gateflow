name: CI
on:
  pull_request:
  push:
    branches: [main, "hardening/**"]
  workflow_dispatch:
concurrency:
  group: gateflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: frontend/package-lock.json,
          }
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          {
            name: backend-jar,
            path: backend/target/gateflow-backend-*.jar,
            if-no-files-found: error,
          }
  full-stack:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: gateflow-ci
      GATEFLOW_DISPOSABLE_STACK: "1"
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Generate disposable CI-only credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, secrets
          replacements={
            'replace-with-a-unique-local-password':secrets.token_hex(24),
            'replace-with-a-unique-redis-password':secrets.token_hex(24),
            'replace-with-a-unique-rabbitmq-password':secrets.token_hex(24),
          }
          text=pathlib.Path('.env.example').read_text()
          for old,new in replacements.items(): text=text.replace(old,new)
          text += '\nDATABASE_APP_PASSWORD=' + secrets.token_hex(24) + '\n'
          pathlib.Path('.env').write_text(text)
          pathlib.Path('.env').chmod(0o600)
          PY
      - run: docker compose config --quiet
      - run: bash scripts/test-stack.sh
      - name: Provision and verify least-privilege runtime credentials
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          env=dict(line.split('=',1) for line in pathlib.Path('.env').read_text().splitlines() if line and not line.startswith('#'))
          sql="\\set runtime_password '"+env['DATABASE_APP_PASSWORD']+"'\n\\set database_name '"+env['POSTGRES_DB']+"'\n"+pathlib.Path('scripts/database/provision-runtime-role.sql').read_text()
          subprocess.run(['docker','compose','exec','-T','postgres','psql','-X','-q','-v','ON_ERROR_STOP=1','-U',env['POSTGRES_USER'],'-d',env['POSTGRES_DB']],input=sql,text=True,check=True)
          subprocess.run(['docker','compose','exec','-T','postgres','psql','-X','-q','-v','ON_ERROR_STOP=1','-U',env['POSTGRES_USER'],'-d',env['POSTGRES_DB']],input=pathlib.Path('scripts/database/verify-runtime-role.sql').read_text(),text=True,check=True)
          PY
          docker compose -f docker-compose.yml -f docker-compose.runtime-role.yml up -d --no-build --wait --wait-timeout 180
      - name: Verify authenticated approval lifecycle on disposable stack
        env:
          GATEFLOW_LOAD_FIXTURE: .load-fixture.json
        run: python3 scripts/verify-browser-flow.py
      - name: Real backend browser navigation
        run: |
          npm --prefix frontend ci --ignore-scripts --no-audit
          cd frontend
          npx playwright install --with-deps chromium
          GATEFLOW_LOAD_FIXTURE="$GITHUB_WORKSPACE/.load-fixture.json" npm run test:browser:live
      - name: Run authenticated business smoke workload
        run: |
          mkdir -p verification
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work -e GATEFLOW_DISPOSABLE_STACK -e GATEFLOW_LOAD_FIXTURE=/work/.load-fixture.json \
            grafana/k6:1.3.0@sha256:3ddc8b1a33a2c3d8edc6e99b6a762ae36cba08788463458f5e6a7703e14eb77d run --summary-export=/work/verification/k6-business-summary.json /work/scripts/performance-business.js
      - name: Disposable backup restore drill
        run: bash scripts/recovery-drill.sh
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with: { version: "v0.75.0", cache: true }
      - name: Application image and source-secret gates
        run: bash scripts/security-scan.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          {
            name: business-smoke-evidence,
            path: verification/k6-business-summary.json,
            if-no-files-found: ignore,
          }
      - name: Tear down only this disposable stack
        if: always()
        run: |
          trap 'rm -f .env .load-fixture.json' EXIT
          docker compose down --volumes --remove-orphans
