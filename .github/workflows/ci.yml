name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        with: {name: backend-jar, path: backend/target/gateflow-backend-*.jar, if-no-files-found: error}
  containers:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/replace-with-a-unique-local-password/ci-database-secret-9284/; s/replace-with-a-unique-redis-password/ci-redis-secret-4829/; s/replace-with-a-unique-rabbitmq-password/ci-rabbit-secret-6193/' .env
      - run: docker compose config --quiet
      - run: docker compose build backend frontend
